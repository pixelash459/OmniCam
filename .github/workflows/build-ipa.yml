name: Build unsigned IPA

# ---------------------------------------------------------------------------
# NOTE: macos-14 is DEPRECATED on GitHub Actions (scheduled for retirement).
# The long-term plan is to build with Theos inside WSL on the user's machine
# (scripts/build-wsl.sh) — fully offline from Apple, no Mac runner needed.
# This workflow exists as the backup path because it is the last image family
# that ships Xcode 15.x — the newest Xcode that can target iOS 12.
#
# Version tags (v*) also build the Windows installer and attach both
# OmniCam.ipa and OmniCam-PC-*-Setup.exe to the GitHub Release.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build-ipa:
    runs-on: macos-14   # last image with Xcode 15.x
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4 (last version supporting iOS 12 deployment)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install xcodegen and ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, arm64, iOS 12.0)
        run: |
          set -o pipefail
          xcodebuild -project OmniCam.xcodeproj \
            -scheme OmniCam \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            -derivedDataPath build build | tail -n 40

      - name: Assemble Payload and fake-sign with ldid
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/OmniCam.app"
          test -d "$APP"
          rm -rf Payload OmniCam.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/OmniCam.app
          # Fake-sign embedded frameworks/dylibs first, then the main binary.
          # ldid -S (ad-hoc, no entitlements) is what AppSync Unified expects;
          # it also avoids the known iOS 12.4 launch-crash with fully unsigned
          # binaries.
          if [ -d Payload/OmniCam.app/Frameworks ]; then
            for fw in Payload/OmniCam.app/Frameworks/*.framework; do
              [ -e "$fw" ] || continue
              ldid -S "$fw/$(basename "${fw%.*}")"
            done
            for dy in Payload/OmniCam.app/Frameworks/*.dylib; do
              [ -e "$dy" ] || continue
              ldid -S "$dy"
            done
          fi
          ldid -S Payload/OmniCam.app/OmniCam
          ldid -e Payload/OmniCam.app/OmniCam >/dev/null 2>&1 || true
          zip -qry OmniCam.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniCam-unsigned.ipa
          path: OmniCam.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OmniCam.ipa
          fail_on_unmatched_files: true

  build-pc-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        working-directory: pc
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Build icon
        working-directory: pc
        run: python packaging/make_icon.py

      - name: PyInstaller onedir
        working-directory: pc
        run: pyinstaller --noconfirm --clean OmniCam.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        working-directory: pc
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc packaging\OmniCam.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniCam-PC-Setup
          path: dist/OmniCam-PC-*-Setup.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OmniCam-PC-*-Setup.exe
          fail_on_unmatched_files: true
